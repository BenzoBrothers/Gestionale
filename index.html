<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Magazzino</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .container {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-container input {
            margin-right: 10px;
            width: calc(50% - 10px);
        }

        .action-buttons button {
            margin-right: 5px;
        }

        .delete-btn {
            background-color: #f44336;
        }

        .delete-btn:hover {
            background-color: #da190b;
        }

        .edit-btn {
            background-color: #2196F3;
        }

        .edit-btn:hover {
            background-color: #0b7dda;
        }
    </style>
</head>
<body>
    <h1>Gestionale Magazzino</h1>

    <div class="container">
        <h2>Aggiungi/Modifica Prodotto</h2>
        <form id="productForm">
            <input type="hidden" id="productId">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label for="codice">Codice:</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="codice" required style="flex: 1;">
                    <button type="button" id="scanButton" style="flex-shrink: 0;">📷 Scansiona Codice a Barre</button>
                </div>
                <div id="reader" style="width: 100%; max-width: 600px; margin-top: 10px; display: none;"></div>
                <div id="scannerError" style="color: red; margin-top: 5px; display: none;"></div>
            </div>
            <div class="form-group">
                <label for="quantita">Quantità:</label>
                <input type="number" id="quantita" required min="0">
            </div>
            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" required>
            </div>
            <div class="form-group">
                <label for="prezzo_unitario">Prezzo Unitario:</label>
                <input type="number" id="prezzo_unitario" required min="0" step="0.01">
            </div>
            <button type="submit">Salva Prodotto</button>
        </form>
    </div>

    <div class="container">
        <h2>Ricerca Prodotti</h2>
        <div class="search-container">
            <input type="text" id="searchNome" placeholder="Cerca per nome...">
            <input type="text" id="searchCategoria" placeholder="Cerca per categoria...">
            <button onclick="searchProducts()">Cerca</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Codice</th>
                    <th>Quantità</th>
                    <th>Categoria</th>
                    <th>Prezzo Unitario</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="productList"></tbody>
        </table>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="script.js"></script>
</body>
</html>
